(function() {
  function injectSupportLink() {
    // Mobile menu: find anchor links inside mobile overlay (added by React)
    var menus = document.querySelectorAll('[data-mobile-menu], .mobile-menu-nav, nav[aria-label]');
    menus.forEach(function(menu) {
      var links = menu.querySelectorAll('a[href="/kontakt/"]');
      links.forEach(function(kontaktLink) {
        if (!menu.querySelector('a[href="/support/"]')) {
          var supportLink = kontaktLink.cloneNode(true);
          supportLink.href = '/support/';
          supportLink.textContent = 'Support';
          kontaktLink.parentNode.insertBefore(supportLink, kontaktLink);
        }
      });
    });
  }
  // Watch for mobile menu being opened
  var observer = new MutationObserver(function() {
    injectSupportLink();
  });
  document.addEventListener('DOMContentLoaded', function() {
    observer.observe(document.body, { childList: true, subtree: true });
    injectSupportLink();
  });
})();
</script>

(function(){
  var lastY=window.scrollY,header=null;
  function getH(){return header||(header=document.querySelector('header.fixed'));}
  function show(v){var h=getH();if(!h)return;h.dataset.show=v?'1':'0';}
  window.addEventListener('scroll',function(){
    var y=window.scrollY;
    requestAnimationFrame(function(){
      if(y<50){show(true);}
      else if(y<lastY-5){show(true);}
      else if(y>lastY+5){show(false);}
      lastY=y;
    });
  },{passive:true});
  window.addEventListener('touchend',function(){
    setTimeout(function(){if(window.scrollY<50)show(true);},100);
  },{passive:true});
  document.addEventListener('DOMContentLoaded',function(){getH();lastY=window.scrollY;show(true);});
})();
</script>

function showChat() {
var dsgvo = document.getElementById('ldm-chat-dsgvo');
var messages = document.getElementById('ldm-chat-messages');
var inputArea = document.getElementById('ldm-chat-input-area');
var footer = document.getElementById('ldm-chat-footer');
if (dsgvo) dsgvo.style.display = 'none';
if (messages) messages.style.display = 'flex';
if (inputArea) inputArea.style.display = 'flex';
if (footer) footer.style.display = 'block';
// Restore session history or show welcome
var session = getSession();
if (session.history.length === 0) {
appendMessage('bot', WELCOME_MSG);
} else {
// Rebuild chat from sessionStorage
session.history.forEach(function (msg) {
appendMessage(msg.role === 'user' ? 'user' : 'bot', msg.content, true);
});
}
scrollToBottom();
}
function appendMessage(type, text, silent) {
var messages = document.getElementById('ldm-chat-messages');
if (!messages) return;
var div = document.createElement('div');
div.className = 'ldm-msg ldm-msg-' + type;
div.textContent = text;
if (silent) div.style.animation = 'none';
messages.appendChild(div);
if (!silent) scrollToBottom();
}
function scrollToBottom() {
var messages = document.getElementById('ldm-chat-messages');
if (messages) messages.scrollTop = messages.scrollHeight;
}
function showTyping() {
var messages = document.getElementById('ldm-chat-messages');
if (!messages) return null;
var typing = document.createElement('div');
typing.className = 'ldm-typing';
typing.id = 'ldm-typing';
typing.innerHTML = '<span></span><span></span><span></span>';
messages.appendChild(typing);
scrollToBottom();
return typing;
}
function removeTyping() {
var t = document.getElementById('ldm-typing');
if (t) t.remove();
}
function sendMessage() {
var inputEl = document.getElementById('ldm-chat-input');
var sendBtn = document.getElementById('ldm-chat-send');
if (!inputEl || !sendBtn) return;
var text = inputEl.value.trim();
if (!text) return;
inputEl.value = '';
inputEl.style.height = 'auto';
sendBtn.disabled = true;
appendMessage('user', text);
// Update session history
var session = getSession();
session.history.push({ role: 'user', content: text });
saveSession(session);
showTyping();
// Send to n8n webhook
// Only sends: sessionId + full conversation history (no name, no IP from our side)
fetch(WEBHOOK_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
sessionId: session.id,
message: text,
history: session.history.slice(-10) // max 10 messages for context
})
})
.then(function (res) {
if (!res.ok) throw new Error('HTTP ' + res.status);
return res.json();
})
.then(function (data) {
removeTyping();
var reply = (data && (data.reply || data.output || data.message || data.text)) || 'Entschuldigung, ich konnte keine Antwort generieren.';
appendMessage('bot', reply);
session = getSession();
session.history.push({ role: 'assistant', content: reply });
saveSession(session);
})
.catch(function (err) {
removeTyping();
appendMessage('bot', 'Es gab einen technischen Fehler. Bitte versuche es erneut oder kontaktiere uns direkt.');
console.warn('[LightDM Chat]', err);
})
.finally(function () {
sendBtn.disabled = false;
var inp = document.getElementById('ldm-chat-input');
if (inp) inp.focus();
});
}
