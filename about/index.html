<script>(function(){function _run(){if(document.getElementById('ldm-chat-btn'))return;// ── CONFIG ──────────────────────────────────────────
// Ersetze mit deiner echten n8n Webhook-URL:
var WEBHOOK_URL = 'https://DEINE-N8N-URL/webhook/lightdm-chat';
var WELCOME_MSG = 'Hallo! Ich bin der KI-Assistent von LightDM. Wie kann ich dir helfen?';
var BOT_NAME = 'LightDM Assistent';
// ── STATE ────────────────────────────────────────────
// sessionStorage: kein Cookie, kein localStorage → wird beim Tab-Schließen gelöscht
var SESSION_KEY = 'ldm_chat_session';
var ACCEPTED_KEY = 'ldm_chat_accepted';
function getSession() {
var s = sessionStorage.getItem(SESSION_KEY);
if (s) return JSON.parse(s);
// Zufällige UUID — nicht mit Person verknüpfbar
var id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
var r = Math.random() * 16 | 0;
return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
});
var session = { id: id, history: [] };
sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
return session;
}
function saveSession(session) {
sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
}
function hasAccepted() {
return sessionStorage.getItem(ACCEPTED_KEY) === '1';
}
function setAccepted() {
sessionStorage.setItem(ACCEPTED_KEY, '1');
}
// ── BUILD UI ─────────────────────────────────────────
// Script runs before </body> — DOM is ready, call directly
function buildWidget() {
// Floating button
var btn = document.createElement('button');
btn.id = 'ldm-chat-btn';
btn.setAttribute('aria-label', 'Chat öffnen');
btn.innerHTML =
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' +
'</svg>' +
'<span id="ldm-chat-badge">1</span>';
// Panel
var panel = document.createElement('div');
panel.id = 'ldm-chat-panel';
panel.setAttribute('role', 'dialog');
panel.setAttribute('aria-label', 'Chat');
panel.innerHTML =
// Header
'<div id="ldm-chat-header">' +
'<div id="ldm-chat-avatar">' +
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
'<circle cx="12" cy="8" r="5"/><path d="M3 21v-2a7 7 0 0 1 14 0v2"/>' +
'</svg>' +
'</div>' +
'<div id="ldm-chat-header-text">' +
'<div id="ldm-chat-header-name">' + BOT_NAME + '</div>' +
'<div id="ldm-chat-header-status">Online</div>' +
'</div>' +
'<button id="ldm-chat-close" aria-label="Schließen">' +
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' +
'</svg>' +
'</button>' +
'</div>' +
// DSGVO screen
'<div id="ldm-chat-dsgvo">' +
'<h4>Datenschutz-Hinweis</h4>' +
'<p>Bevor du schreibst, ein kurzer Hinweis zum Datenschutz:</p>' +
'<ul class="ldm-dsgvo-list">' +
'<li>Kein Name und keine E-Mail werden abgefragt</li>' +
'<li>Die Unterhaltung ist vollständig anonym</li>' +
'<li>Keine Cookies, kein Tracking</li>' +
'<li>Daten werden nur für die Dauer dieser Sitzung gespeichert</li>' +
'<li>Beim Schließen des Tabs wird alles gelöscht</li>' +
'</ul>' +
'<button id="ldm-chat-accept">Verstanden — Chat starten</button>' +
'</div>' +
// Chat screen (hidden initially)
'<div id="ldm-chat-messages" style="display:none"></div>' +
'<div id="ldm-chat-input-area" style="display:none">' +
'<textarea id="ldm-chat-input" placeholder="Nachricht schreiben…" rows="1" maxlength="500"></textarea>' +
'<button id="ldm-chat-send" aria-label="Senden">' +
'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>' +
'</svg>' +
'</button>' +
'</div>' +
'<div id="ldm-chat-footer" style="display:none">ANONYM · KEINE COOKIES · DSGVO-KONFORM</div>';
document.body.appendChild(btn);
document.body.appendChild(panel);
// Show unread badge after 3s to grab attention
setTimeout(function () {
var badge = document.getElementById('ldm-chat-badge');
if (badge && !panel.classList.contains('open')) badge.classList.add('show');
}, 3000);
// ── EVENTS ─────────────────────────────────────────
btn.addEventListener('click', function () {
var badge = document.getElementById('ldm-chat-badge');
if (badge) badge.classList.remove('show');
panel.classList.toggle('open');
if (panel.classList.contains('open')) {
if (hasAccepted()) showChat();
setTimeout(function () {
var inp = document.getElementById('ldm-chat-input');
if (inp) inp.focus();
}, 250);
}
});
document.getElementById('ldm-chat-close').addEventListener('click', function () {
panel.classList.remove('open');
});
document.getElementById('ldm-chat-accept').addEventListener('click', function () {
setAccepted();
showChat();
setTimeout(function () {
var inp = document.getElementById('ldm-chat-input');
if (inp) inp.focus();
}, 100);
});
var sendBtn = document.getElementById('ldm-chat-send');
var inputEl = document.getElementById('ldm-chat-input');
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', function (e) {
if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
// Auto-resize textarea
inputEl.addEventListener('input', function () {
this.style.height = 'auto';
this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
// If already accepted in this session, restore chat
if (hasAccepted()) {
var session = getSession();
if (session.history.length > 0) {
// Will restore when opened
}
}
}
function showChat() {
var dsgvo = document.getElementById('ldm-chat-dsgvo');
var messages = document.getElementById('ldm-chat-messages');
var inputArea = document.getElementById('ldm-chat-input-area');
var footer = document.getElementById('ldm-chat-footer');
if (dsgvo) dsgvo.style.display = 'none';
if (messages) messages.style.display = 'flex';
if (inputArea) inputArea.style.display = 'flex';
if (footer) footer.style.display = 'block';
// Restore session history or show welcome
var session = getSession();
if (session.history.length === 0) {
appendMessage('bot', WELCOME_MSG);
} else {
// Rebuild chat from sessionStorage
session.history.forEach(function (msg) {
appendMessage(msg.role === 'user' ? 'user' : 'bot', msg.content, true);
});
}
scrollToBottom();
}
function appendMessage(type, text, silent) {
var messages = document.getElementById('ldm-chat-messages');
if (!messages) return;
var div = document.createElement('div');
div.className = 'ldm-msg ldm-msg-' + type;
div.textContent = text;
if (silent) div.style.animation = 'none';
messages.appendChild(div);
if (!silent) scrollToBottom();
}
function scrollToBottom() {
var messages = document.getElementById('ldm-chat-messages');
if (messages) messages.scrollTop = messages.scrollHeight;
}
function showTyping() {
var messages = document.getElementById('ldm-chat-messages');
if (!messages) return null;
var typing = document.createElement('div');
typing.className = 'ldm-typing';
typing.id = 'ldm-typing';
typing.innerHTML = '<span></span><span></span><span></span>';
messages.appendChild(typing);
scrollToBottom();
return typing;
}
function removeTyping() {
var t = document.getElementById('ldm-typing');
if (t) t.remove();
}
function sendMessage() {
var inputEl = document.getElementById('ldm-chat-input');
var sendBtn = document.getElementById('ldm-chat-send');
if (!inputEl || !sendBtn) return;
var text = inputEl.value.trim();
if (!text) return;
inputEl.value = '';
inputEl.style.height = 'auto';
sendBtn.disabled = true;
appendMessage('user', text);
// Update session history
var session = getSession();
session.history.push({ role: 'user', content: text });
saveSession(session);
showTyping();
// Send to n8n webhook
// Only sends: sessionId + full conversation history (no name, no IP from our side)
fetch(WEBHOOK_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
sessionId: session.id,
message: text,
history: session.history.slice(-10) // max 10 messages for context
})
})
.then(function (res) {
if (!res.ok) throw new Error('HTTP ' + res.status);
return res.json();
})
.then(function (data) {
removeTyping();
var reply = (data && (data.reply || data.output || data.message || data.text)) || 'Entschuldigung, ich konnte keine Antwort generieren.';
appendMessage('bot', reply);
session = getSession();
session.history.push({ role: 'assistant', content: reply });
saveSession(session);
})
.catch(function (err) {
removeTyping();
appendMessage('bot', 'Es gab einen technischen Fehler. Bitte versuche es erneut oder kontaktiere uns direkt.');
console.warn('[LightDM Chat]', err);
})
.finally(function () {
sendBtn.disabled = false;
var inp = document.getElementById('ldm-chat-input');
if (inp) inp.focus();
});
}
buildWidget();var _b=document.getElementById('ldm-chat-btn');var _p=document.getElementById('ldm-chat-panel');if(_b&&_p){new MutationObserver(function(){if(!document.body.contains(_b)){document.body.appendChild(_b);document.body.appendChild(_p);}}).observe(document.body,{childList:true});}}window.addEventListener('load',_run);if(document.readyState==='complete')setTimeout(_run,50);})();</script>
</html>
