<body>

<script>(function(){
function _run(){
  if(document.getElementById('ldm-zammad-btn'))return;
  // Create floating button
  var btn=document.createElement('button');
  btn.id='ldm-zammad-btn';
  btn.setAttribute('aria-label','Chat öffnen');
  btn.innerHTML='<svg class="ldmz-icon-chat" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg><svg class="ldmz-icon-close" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>';
  document.body.appendChild(btn);
  // Load Zammad script
  var s=document.createElement('script');
  s.src='https://ticket.light-dm.de/assets/chat/chat-no-jquery.min.js';
  s.onload=function(){
    var chat=new ZammadChat({fontSize:'14px',chatId:1,show:false,background:'#F5C518',flat:true,title:'<b>LightDM Support</b>'});
    var open=false;
    btn.addEventListener('click',function(){
      open=!open;
      btn.classList.toggle('is-open',open);
      if(open){
        if(typeof chat.open==='function'){chat.open();}
        else{var zb=document.querySelector('.zammad-chat-button');if(zb)zb.click();}
      }else{
        if(typeof chat.close==='function'){chat.close();}
        open=false;btn.classList.remove('is-open');
      }
    });
    // Sync state if user closes via Zammad's own X
    document.addEventListener('click',function(e){
      if(e.target&&e.target.classList&&e.target.classList.contains('zammad-chat-close')){
        open=false;btn.classList.remove('is-open');
      }
    });
  };
  document.head.appendChild(s);
  // Re-attach button if React navigation removes it
  new MutationObserver(function(){
    if(!document.body.contains(btn)){document.body.appendChild(btn);}
  }).observe(document.body,{childList:true});
}
window.addEventListener('load',_run);
if(document.readyState==='complete')setTimeout(_run,50);
})();</script>
<script>(function(){

<script>(function(){
function _run(){
  if(document.getElementById('ldm-zammad-btn'))return;
  // Create floating button — Zammad handles open/close via buttonClass
  var btn=document.createElement('button');
  btn.id='ldm-zammad-btn';
  btn.className='open-zammad-chat';
  btn.setAttribute('aria-label','Chat öffnen');
  btn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>';
  document.body.appendChild(btn);
  // Init ZammadChat — retry until defer script has executed
  function initChat(){
    if(!window.ZammadChat){setTimeout(initChat,100);return;}
    new ZammadChat({
      chatId:1,
      show:false,
      host:'https://ticket.light-dm.de',
      buttonClass:'open-zammad-chat',
      inactiveClass:'is-inactive',
      cssAutoload:false,
      title:'<b>LightDM</b> Support',
      fontSize:'14px',
      flat:true
    });
  }
  initChat();
  // Re-attach button if React navigation removes it
  new MutationObserver(function(){
    if(!document.body.contains(btn)){document.body.appendChild(btn);}
  }).observe(document.body,{childList:true});
}
window.addEventListener('load',_run);
if(document.readyState==='complete')setTimeout(_run,50);
})();</script>
<script>(function(){
function _cursor(){
  var dot=document.querySelector('.cursor-dot');
  var ring=document.querySelector('.cursor-ring');
  if(!dot){
    dot=document.createElement('div');dot.className='cursor-dot';
    document.body.appendChild(dot);
  }
  if(!ring){
    ring=document.createElement('div');ring.className='cursor-ring';
    document.body.appendChild(ring);
  }
  return {dot:dot,ring:ring};
}
var mx=window.innerWidth/2,my=window.innerHeight/2;
var rx=mx,ry=my;
var ticking=false;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;},{ passive:true });
function loop(){
  var c=_cursor();
  c.dot.style.left=mx+'px';c.dot.style.top=my+'px';
  rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;
  c.ring.style.left=rx+'px';c.ring.style.top=ry+'px';
  requestAnimationFrame(loop);
}
document.addEventListener('mouseover',function(e){
  var t=e.target;
  if(t&&(t.tagName==='A'||t.tagName==='BUTTON'||t.closest('a')||t.closest('button'))){
    var c=_cursor();if(c.ring)c.ring.classList.add('hovering');
  }
},{passive:true});
document.addEventListener('mouseout',function(e){
  var t=e.target;
  if(t&&(t.tagName==='A'||t.tagName==='BUTTON'||t.closest('a')||t.closest('button'))){
    var c=_cursor();if(c.ring)c.ring.classList.remove('hovering');
  }
},{passive:true});
function start(){_cursor();loop();}
window.addEventListener('load',start);
if(document.readyState==='complete')setTimeout(start,50);
})();</script>
</html>
