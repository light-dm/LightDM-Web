<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=/ueber-uns">
<link rel="canonical" href="https://light-dm.de/ueber-uns">
<title>Weiterleitung...</title>
<link rel="stylesheet" href="/design-v2.css">
<script src="/design-v2.js" defer></script>
<link rel="stylesheet" href="/zammad-chat.css">
</head>
<body>
<p>Diese Seite wurde verschoben. <a href="/ueber-uns">Hier klicken</a>.</p>



<script>(function(){
  var _open=false,_pending=false;
  function addBtn(){
    if(document.getElementById('ldm-chat-btn'))return;
    var b=document.createElement('button');
    b.id='ldm-chat-btn';b.setAttribute('aria-label','Chat');
    b.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>';
    document.body.appendChild(b);
    b.addEventListener('click',function(){
      var c=document.querySelector('.zammad-chat');
      if(!c){_pending=!_pending;return;}
      _open=!_open;
      if(_open)c.classList.add('ldm-visible');
      else c.classList.remove('ldm-visible');
    });
  }
  addBtn();[200,500,1000].forEach(function(t){setTimeout(addBtn,t);});
  // Zammad erst nach Seitenload laden (nicht-blockierend)
  function loadZammad(){
    var s=document.createElement('script');
    s.src='https://ticket.light-dm.de/assets/chat/chat-no-jquery.min.js';
    s.onload=function(){
      new MutationObserver(function(m,o){
        var c=document.querySelector('.zammad-chat');
        if(!c)return;
        o.disconnect();
        if(_pending){c.classList.add('ldm-visible');_open=true;_pending=false;}
      }).observe(document.body,{childList:true,subtree:true});
      new ZammadChat({fontSize:'12px',chatId:1});
    };
    document.head.appendChild(s);
  }
  if(document.readyState==='complete'){loadZammad();}
  else{window.addEventListener('load',loadZammad);}
})();
</script>
</body>




<script>(function(){
function _cursor(){
  var dot=document.querySelector('.cursor-dot');
  var ring=document.querySelector('.cursor-ring');
  if(!dot){
    dot=document.createElement('div');dot.className='cursor-dot';
    document.body.appendChild(dot);
  }
  if(!ring){
    ring=document.createElement('div');ring.className='cursor-ring';
    document.body.appendChild(ring);
  }
  return {dot:dot,ring:ring};
}
var mx=window.innerWidth/2,my=window.innerHeight/2;
var rx=mx,ry=my;
var ticking=false;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;},{ passive:true });
function loop(){
  var c=_cursor();
  c.dot.style.left=mx+'px';c.dot.style.top=my+'px';
  rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;
  c.ring.style.left=rx+'px';c.ring.style.top=ry+'px';
  requestAnimationFrame(loop);
}
document.addEventListener('mouseover',function(e){
  var t=e.target;
  if(t&&(t.tagName==='A'||t.tagName==='BUTTON'||t.closest('a')||t.closest('button'))){
    var c=_cursor();if(c.ring)c.ring.classList.add('hovering');
  }
},{passive:true});
document.addEventListener('mouseout',function(e){
  var t=e.target;
  if(t&&(t.tagName==='A'||t.tagName==='BUTTON'||t.closest('a')||t.closest('button'))){
    var c=_cursor();if(c.ring)c.ring.classList.remove('hovering');
  }
},{passive:true});
function start(){_cursor();loop();}
window.addEventListener('load',start);
if(document.readyState==='complete')setTimeout(start,50);
})();</script>
</html>
